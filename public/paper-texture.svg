<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Heavy Woven Paper Fiber Noise -->
    <filter id="cottonFibers" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox">
      <feTurbulence type="fractalNoise" baseFrequency="0.45" numOctaves="6" result="noise1" />
      <feTurbulence type="turbulence" baseFrequency="0.08" numOctaves="3" result="noise2" />
      <feDisplacementMap in="noise1" in2="noise2" scale="5" xChannelSelector="R" yChannelSelector="G" result="displaced" />
      <feColorMatrix type="matrix" values="
        1 0 0 0 0.95
        0 1 0 0 0.93
        0 0 1 0 0.88
        0 0 0 0.35 0" result="coloredNoise" />
    </filter>
    
    <pattern id="linenWeave" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0,10 Q 20,5 40,10 M 0,20 Q 20,25 40,20 M 0,30 Q 20,25 40,30" stroke="rgba(160,150,130,0.12)" stroke-width="1.2" fill="none" />
      <path d="M 10,0 Q 5,20 10,40 M 20,0 Q 25,20 20,40 M 30,0 Q 25,20 30,40" stroke="rgba(160,150,130,0.12)" stroke-width="1.2" fill="none" />
    </pattern>
  </defs>

  <!-- Warm Off-White Cotton Base -->
  <rect width="800" height="800" fill="#f4f2ea" />
  
  <!-- Subtle Linen Weave Grid -->
  <rect width="800" height="800" fill="url(#linenWeave)" />
  
  <!-- High Density Organic Paper Fiber Grain -->
  <rect width="800" height="800" filter="url(#cottonFibers)" style="mix-blend-mode: multiply;" />

  <!-- Soft Paper Shading Overlay -->
  <rect width="800" height="800" fill="radial-gradient(circle at 50% 50%, transparent 40%, rgba(200, 190, 175, 0.25) 100%)" />
</svg>
